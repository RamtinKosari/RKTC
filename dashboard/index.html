<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RKTC Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        primary: {
                            DEFAULT: "hsl(var(--primary))",
                            foreground: "hsl(var(--primary-foreground))",
                        },
                        secondary: {
                            DEFAULT: "hsl(var(--secondary))",
                            foreground: "hsl(var(--secondary-foreground))",
                        },
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                        accent: {
                            DEFAULT: "hsl(var(--accent))",
                            foreground: "hsl(var(--accent-foreground))",
                        },
                        card: {
                            DEFAULT: "hsl(var(--card))",
                            foreground: "hsl(var(--card-foreground))",
                        },
                        destructive: {
                            DEFAULT: "hsl(var(--destructive))",
                            foreground: "hsl(var(--destructive-foreground))",
                        },
                    },
                    borderRadius: {
                        lg: "var(--radius)",
                        md: "calc(var(--radius) - 2px)",
                        sm: "calc(var(--radius) - 4px)",
                    },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-background text-foreground min-h-screen antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-80 flex flex-col border-r border-border bg-card">
            <!-- Header -->
            <div class="p-4 border-b border-border">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-lg font-semibold tracking-tight">RKTC Dashboard</h1>
                        <p class="text-xs text-muted-foreground">Categorized Telegram messages</p>
                    </div>
                    <button id="themeToggle" class="inline-flex items-center justify-center h-8 w-8 rounded-md border border-border bg-background hover:bg-accent transition-colors" title="Toggle theme">
                        <svg id="moonIcon" class="h-4 w-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                        <svg id="sunIcon" class="h-4 w-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Filters -->
            <div class="p-4 space-y-4 border-b border-border">
                <div>
                    <label class="text-xs font-medium text-muted-foreground uppercase mb-1.5 block">Search</label>
                    <input type="text" id="searchInput" placeholder="Search messages..." class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-2 text-sm shadow-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-medium text-muted-foreground uppercase mb-1.5 block">From</label>
                        <input type="date" id="startDate" class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-2 text-sm shadow-sm ring-offset-background focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-muted-foreground uppercase mb-1.5 block">To</label>
                        <input type="date" id="endDate" class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-2 text-sm shadow-sm ring-offset-background focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <button id="resetFilters" class="inline-flex items-center justify-center rounded-md text-xs font-medium text-muted-foreground hover:text-foreground h-8 px-3 transition-colors">Reset filters</button>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="showReplies" class="h-4 w-4 rounded border-border text-primary focus:ring-ring" checked>
                        <label for="showReplies" class="text-xs text-muted-foreground cursor-pointer">Show replies</label>
                    </div>
                </div>
            </div>

            <!-- Categories -->
            <div class="flex-1 overflow-y-auto p-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-sm font-medium">Categories</h2>
                    <button id="selectAll" class="text-xs text-primary hover:underline font-medium">Select all</button>
                </div>
                <div id="categoryList" class="space-y-1">
                    <div class="text-sm text-muted-foreground">Loading categories...</div>
                </div>
            </div>

            <!-- Footer stats -->
            <div class="p-4 border-t border-border">
                <p id="statsText" class="text-xs text-muted-foreground">Loading...</p>
            </div>
        </aside>

        <!-- Main -->
        <main class="flex-1 flex flex-col min-w-0 bg-background">
            <div class="p-4 border-b border-border bg-card/50">
                <h2 id="viewTitle" class="text-lg font-semibold">All Categories</h2>
                <p id="viewSubtitle" class="text-xs text-muted-foreground">Combined timeline sorted by timestamp</p>
            </div>

            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 md:p-6">
                <div class="text-center text-muted-foreground py-12">Loading messages...</div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
